[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-agent-security-platform"
version = "0.1.0"
description = "AI Agent Security & Safety Platform (Phase 0a repository foundation)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14.0,<2.0.0",
    "asyncpg>=0.30.0,<1.0.0",
    "fastapi>=0.115.0,<1.0.0",
    "httpx2>=2.0.0,<3.0.0",
    "pydantic>=2.9.0,<3.0.0",
    "pydantic-settings>=2.6.0,<3.0.0",
    "pyyaml>=6.0.2,<7.0.0",
    "sqlalchemy[asyncio]>=2.0.36,<3.0.0",
    "uvicorn[standard]>=0.32.0,<1.0.0",
]

[dependency-groups]
dev = [
    "mypy>=1.13.0,<2.0.0",
    "pytest>=8.3.0,<9.0.0",
    "ruff>=0.8.0,<1.0.0",
    "types-pyyaml>=6.0.12,<7.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ai_security"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
# The blueprint and its archive are authoritative documents and must never be
# reformatted, even though they contain fenced Python examples.
extend-exclude = ["AI_Agent_Security_Platform_Master_Blueprint_v1.2.md", "archive"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["asyncpg"]
ignore_missing_imports = true
