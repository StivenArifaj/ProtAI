# Policy self-check fixtures (ADR-007; blueprint sections 10.3, 10.7).
#
# Every fixture is deterministic and side-effect-free: it names one evaluation case and
# the decision the v1 policy decision matrix mandates for it. Startup and readiness
# evaluate all fixtures against the loaded policy documents (config/policies.yaml +
# config/risk_thresholds.yaml) and the real deterministic engine; ANY mismatch fails
# startup/readiness.
#
# A fixture may carry a `tool_policy` override (strictly validated by the same model as
# production policy) to express matrix rows the starter policy deliberately does not
# enable — the "dedicated test scenario" of blueprint section 10.5 (most importantly:
# external egress enabled with an exact destination allowlist). The starter policy
# itself always keeps external egress disabled.
#
# Representative rows (not exhaustive) from docs/POLICY_DECISION_MATRIX.md; adding a
# fixture requires the matrix row it derives from.

fixtures:
  - name: allowed-mock-read
    description: READ_ONLY on data the principal may read, low residual risk -> ALLOW.
    case:
      tool_id: mock_email.read
      side_effect_class: READ_ONLY
      data_class: INTERNAL
      risk_score: 10
    expected_decision: ALLOW
    expected_reason: authorized_read

  - name: forbidden-external-egress
    description: EXTERNAL_MUTATION to a destination that is not allowlisted -> BLOCK.
    tool_policy:
      side_effect_class: EXTERNAL_MUTATION
      external_egress_enabled: true
      allowed_destinations: ["https://sink.internal.example/collect"]
    case:
      tool_id: mock_external_sink.write
      side_effect_class: EXTERNAL_MUTATION
      data_class: PUBLIC
      risk_score: 10
      destination: https://evil.example/collect
    expected_decision: BLOCK
    expected_reason: destination_not_allowlisted

  - name: cross-user-resource-denial
    description: resource not authorized for this principal -> BLOCK before any score.
    case:
      tool_id: mock_files.read
      side_effect_class: READ_ONLY
      data_class: INTERNAL
      risk_score: 5
      resource_authorized: false
    expected_decision: BLOCK
    expected_reason: resource_not_authorized

  - name: unknown-tool-denial
    description: tool is not registered in the policy catalog -> BLOCK.
    case:
      tool_id: shell.exec
      side_effect_class: DESTRUCTIVE
      data_class: RESTRICTED
      risk_score: 0
    expected_decision: BLOCK
    expected_reason: unknown_tool

  - name: invalid-argument-denial
    description: arguments fail schema validation -> BLOCK.
    case:
      tool_id: mock_email.search
      side_effect_class: READ_ONLY
      data_class: INTERNAL
      risk_score: 5
      arguments_valid: false
    expected_decision: BLOCK
    expected_reason: invalid_arguments

  - name: restricted-data-egress-block
    description: RESTRICTED data to an approved external destination -> BLOCK in v1.
    tool_policy:
      side_effect_class: EXTERNAL_MUTATION
      external_egress_enabled: true
      allowed_destinations: ["https://sink.internal.example/collect"]
    case:
      tool_id: mock_external_sink.write
      side_effect_class: EXTERNAL_MUTATION
      data_class: RESTRICTED
      risk_score: 10
      destination: https://sink.internal.example/collect
    expected_decision: BLOCK
    expected_reason: restricted_egress_blocked

  - name: hard-deny-low-risk
    description: hard-denied action with risk 0 -> BLOCK; score cannot override hard constraints.
    case:
      tool_id: mock_email.read
      side_effect_class: READ_ONLY
      data_class: PUBLIC
      risk_score: 0
      hard_deny: true
    expected_decision: BLOCK
    expected_reason: hard_denied

  - name: allowed-explicit-local-write
    description: LOCAL_MUTATION on PUBLIC data, low risk, explicitly permitted -> ALLOW.
    tool_policy:
      side_effect_class: LOCAL_MUTATION
      explicitly_permitted: true
    case:
      tool_id: mock_files.write
      side_effect_class: LOCAL_MUTATION
      data_class: PUBLIC
      risk_score: 20
    expected_decision: ALLOW
    expected_reason: explicitly_permitted_local_write

  - name: confidential-local-write-needs-approval
    description: LOCAL_MUTATION on CONFIDENTIAL data, mid risk, approval-eligible -> ASK_USER.
    tool_policy:
      side_effect_class: LOCAL_MUTATION
      approval_eligible: true
    case:
      tool_id: mock_files.write
      side_effect_class: LOCAL_MUTATION
      data_class: CONFIDENTIAL
      risk_score: 50
    expected_decision: ASK_USER
    expected_reason: confidential_write_requires_approval

  - name: restricted-local-write-blocked
    description: LOCAL_MUTATION on RESTRICTED data -> BLOCK in v1.
    tool_policy:
      side_effect_class: LOCAL_MUTATION
    case:
      tool_id: mock_files.write
      side_effect_class: LOCAL_MUTATION
      data_class: RESTRICTED
      risk_score: 10
    expected_decision: BLOCK
    expected_reason: restricted_write_not_registered

  - name: destructive-blocked
    description: DESTRUCTIVE tools are not registered for execution in v1 -> BLOCK.
    tool_policy:
      side_effect_class: DESTRUCTIVE
    case:
      tool_id: mock_files.delete
      side_effect_class: DESTRUCTIVE
      data_class: PUBLIC
      risk_score: 5
    expected_decision: BLOCK
    expected_reason: destructive_not_registered

  - name: external-egress-disabled-by-default
    description: EXTERNAL_MUTATION is disabled unless explicitly enabled -> BLOCK
      (starter policy default; no override).
    case:
      tool_id: mock_external_sink.write
      side_effect_class: EXTERNAL_MUTATION
      data_class: PUBLIC
      risk_score: 5
      destination: https://sink.internal.example/collect
    expected_decision: BLOCK
    expected_reason: external_egress_disabled

  - name: allowed-allowlisted-external-call
    description: EXTERNAL_MUTATION PUBLIC, exact allowlisted destination, low risk,
      egress explicitly enabled -> ALLOW.
    tool_policy:
      side_effect_class: EXTERNAL_MUTATION
      external_egress_enabled: true
      allowed_destinations: ["https://sink.internal.example/collect"]
    case:
      tool_id: mock_external_sink.write
      side_effect_class: EXTERNAL_MUTATION
      data_class: PUBLIC
      risk_score: 10
      destination: https://sink.internal.example/collect
    expected_decision: ALLOW
    expected_reason: allowlisted_external_call

  - name: high-risk-read-blocked
    description: READ_ONLY with residual risk 80-100 -> BLOCK.
    case:
      tool_id: mock_email.read
      side_effect_class: READ_ONLY
      data_class: INTERNAL
      risk_score: 90
    expected_decision: BLOCK
    expected_reason: risk_too_high

  - name: mid-risk-read-needs-clarification
    description: READ_ONLY with mid risk, approval-eligible -> ASK_USER.
    tool_policy:
      side_effect_class: READ_ONLY
      approval_eligible: true
    case:
      tool_id: mock_email.read
      side_effect_class: READ_ONLY
      data_class: INTERNAL
      risk_score: 55
    expected_decision: ASK_USER
    expected_reason: risk_requires_clarification

  - name: internal-egress-approved-destination
    description: EXTERNAL_MUTATION INTERNAL, enabled+allowlisted destination, mid risk,
      approval-eligible -> ASK_USER (never a silent allow).
    tool_policy:
      side_effect_class: EXTERNAL_MUTATION
      external_egress_enabled: true
      allowed_destinations: ["https://sink.internal.example/collect"]
      approval_eligible: true
    case:
      tool_id: mock_external_sink.write
      side_effect_class: EXTERNAL_MUTATION
      data_class: INTERNAL
      risk_score: 20
      destination: https://sink.internal.example/collect
    expected_decision: ASK_USER
    expected_reason: internal_egress_requires_approval

  - name: confidential-egress-blocked
    description: EXTERNAL_MUTATION on CONFIDENTIAL data -> BLOCK; no approval exception.
    tool_policy:
      side_effect_class: EXTERNAL_MUTATION
      external_egress_enabled: true
      allowed_destinations: ["https://sink.internal.example/collect"]
    case:
      tool_id: mock_external_sink.write
      side_effect_class: EXTERNAL_MUTATION
      data_class: CONFIDENTIAL
      risk_score: 10
      destination: https://sink.internal.example/collect
    expected_decision: BLOCK
    expected_reason: confidential_egress_blocked

  # Phase 2 gateway facts (blueprint sections 12.3, 6.1; ADR-009). These fixtures are
  # engine-level rows for facts the gateway produces before evaluation.

  - name: binding-mismatch-denial
    description: the proposal is not bound to the verified request/context -> BLOCK.
    case:
      tool_id: mock_email.read
      side_effect_class: READ_ONLY
      data_class: INTERNAL
      risk_score: 5
      binding_valid: false
    expected_decision: BLOCK
    expected_reason: binding_mismatch

  - name: deadline-exceeded-denial
    description: the proposal deadline already passed -> BLOCK regardless of risk.
    case:
      tool_id: mock_email.read
      side_effect_class: READ_ONLY
      data_class: INTERNAL
      risk_score: 0
      deadline_exceeded: true
    expected_decision: BLOCK
    expected_reason: deadline_exceeded

  - name: inconsistent-destination-denial
    description: declared destination metadata disagrees with the validated call -> BLOCK.
    tool_policy:
      side_effect_class: EXTERNAL_MUTATION
      external_egress_enabled: true
      allowed_destinations: ["https://sink.internal.example/collect"]
    case:
      tool_id: mock_external_sink.write
      side_effect_class: EXTERNAL_MUTATION
      data_class: PUBLIC
      risk_score: 10
      destination: https://sink.internal.example/collect
      destination_consistent: false
    expected_decision: BLOCK
    expected_reason: invalid_destination

  - name: unregistered-destination-capability
    description: destination is policy-allowlisted but outside the tool's registered
      destination capability -> BLOCK (never executed).
    tool_policy:
      side_effect_class: EXTERNAL_MUTATION
      external_egress_enabled: true
      allowed_destinations: ["https://sink.internal.example/collect"]
    case:
      tool_id: mock_external_sink.write
      side_effect_class: EXTERNAL_MUTATION
      data_class: PUBLIC
      risk_score: 10
      destination: https://sink.internal.example/collect
      destination_registered: false
    expected_decision: BLOCK
    expected_reason: destination_not_allowlisted
